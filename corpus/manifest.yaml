    title: "Recycling 101: The Correct Choices (re Kiosk poster)"
    url: https://www.wastereduction.hku.hk/_files/ugd/bccd45_652bab3854994da9a05b96ed09580df4.pdf
    page_url: https://www.wastereduction.hku.hk/recycling-101
    publisher: HKU re Campaign (Sustainability Unit, Estates Office)
    retrieved_at: "2026-10-18"
    raw_files:
      - raw/r101_poster/recycling-101-poster.pdf
      - raw/r101_poster/recycling-101-poster.jpg
      - raw/r101_poster/recycling-101.html
