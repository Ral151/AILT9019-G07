# Corpus manifest (M1). Every answer the app gives must trace back to a
# source listed here. Rebuild the vector store with: python scripts/ingest.py
#
# extraction:
#   html_text            - lines copied from the saved HTML; ingest.py verifies
#                          every chunk line appears in the snapshot.
#   manual_transcription - the official document is an image/outlined PDF with
#                          no text layer; the English text was typed out and
#                          MUST be checked line by line against the raw file
#                          by a team member before review.status = reviewed.
#
# review.status: draft -> reviewed. `python scripts/ingest.py --require-reviewed`
# refuses to build until every source and chunk is reviewed (use it to freeze).

corpus_version: "2026-10-18.1"
language: en  # English text only; the posters also carry Traditional Chinese.

# Bin/stream taxonomy extracted from the documents (§12 Q3). `stream` values in
# chunk files must be one of these names (case-insensitive).
streams:
  - Paper            # re Kiosk list; Recycling 101 poster
  - Tetra Pak        # re Kiosk list; Recycling 101 poster
  - Metal            # re Kiosk list; poster ("Metal"), photo guide ("Metals")
  - Glass Bottle     # re Kiosk list; poster; photo guide ("Glass Bottles")
  - Plastic          # re Kiosk list; poster; photo guide ("Plastics")
  - Rechargeable Battery  # re Kiosk list; poster; photo guide ("Rechargeable Batteries")
  - Plastic bottle   # Smart Recycling Bins compartment (re Facilities page)
  - Other plastic    # Smart Recycling Bins compartment (re Facilities page)

# Names the answer validator treats as bin/stream names (FR-6 check 4). An
# answer may only use one of these if a cited excerpt also contains it.
# "Plastic bottle" is left out on purpose: it is also an ordinary item name.
bin_vocabulary:
  - Paper
  - Tetra Pak
  - Metal
  - Glass Bottle
  - Plastic
  - Rechargeable Battery
  - Other plastic

sources:
